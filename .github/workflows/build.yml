name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          if [ -f MainActivity.java ]; then
            mkdir -p app/src/main/java/com/pharmacy/manager app/src/main/assets
            mv MainActivity.java app/src/main/java/com/pharmacy/manager/MainActivity.java
            mv index.html app/src/main/assets/index.html
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
            mv app-build.gradle app/build.gradle
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pharmacy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
